name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        # Only the targets we actually use, not the Makefile's full
        # darwin/linux/netbsd/openbsd/solaris/windows matrix. Calling the
        # per-binary make targets directly (rather than build-release)
        # avoids touching the Makefile itself, which the rest of the
        # matrix and `make build`/`make install` still rely on.
        run: |
          mkdir -p dist
          make \
            dist/paperless-ngx-mcp-darwin-arm64 \
            dist/paperless-ngx-mcp-linux-amd64 \
            dist/paperless-ngx-mcp-windows-amd64.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
